<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salery Bingo - Admin Panel</title>
    <script>
      // Instantly forward to main SPA with #admin hash
      window.location.replace("/#admin");
    </script>
    <style>
      body {
        margin: 0;
        background-color: #0f0a1c;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid #281850;
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 { margin: 0 0 8px 0; color: #f59e0b; font-size: 20px; font-weight: 800; }
      p { margin: 0 0 16px 0; color: #94a3b8; font-size: 14px; }
      a {
        display: inline-block;
        padding: 10px 20px;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <h2>ወደ አድሚን ፓነል በመግባት ላይ...</h2>
    <p>Redirecting to Salery Bingo Admin Panel...</p>
    <a href="/#admin">ካልተከፈተ እዚህ ይጫኑ (Open Admin)</a>
  </body>
</html>
